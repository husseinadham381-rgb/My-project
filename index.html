<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أَدْهَم التعليمية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0B132B;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #1C2541;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #3A506B;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-w: 500px;
            width: 90%;
        }
        h1 {
            color: #48CAE4;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #A5A5A5;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        .badge {
            background-color: rgba(72, 202, 228, 0.2);
            color: #48CAE4;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #5C677D;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>منصة أَدْهَم</h1>
        <p>النظام الذكي لإدارة الامتحانات والتقييم الفوري</p>
        <span class="badge">الموقع قيد التجهيز والنشر اللايف</span>
        <div class="footer">
            تم التطوير بواسطة المهندس أدهم حسين © 2026
        </div>
    </div>

</body>
</html>
